<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth">
        <div class="auth-container">
            
            <form action="" method="post" class="auth-form">
                <div class="itemscontainer">
                    <div class="auth-logo">
                        <svg width="100px" viewBox="0 0 60 62" fill="none" class="signInIcon__TpQ4"><circle cx="30" cy="30" r="30" fill="#EAFBF7"></circle><circle cx="29.887" cy="29.887" r="22.521" fill="#D3F6EE"></circle><path d="M24.273 59.597l-5.421-6.17a3.112 3.112 0 01.254-4.362 3.033 3.033 0 014.312.257l3.797 4.323V35.789c0-.79.31-1.547.861-2.105a2.925 2.925 0 012.08-.871c.78 0 1.53.313 2.08.871.553.558.863 1.315.863 2.105V49.18h2.942c2.34 0 4.585.94 6.24 2.615a8.98 8.98 0 012.585 6.313v1.49" stroke="#008768" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M38.973 42.188a14.88 14.88 0 005.223-7.468c.922-2.981.892-6.18-.086-9.143a14.872 14.872 0 00-5.362-7.366 14.633 14.633 0 00-8.614-2.81c-3.092 0-6.106.984-8.614 2.81a14.872 14.872 0 00-5.362 7.366 15.024 15.024 0 00-.086 9.143 14.88 14.88 0 005.223 7.468" stroke="#008768" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    </div>
                    <h1>Log in and get exploring</h1>
                    <p style="text-align: center;">Log into your account with your email and password, or create one below. Quick and easy - promise!</p>
                
                </div>
                
                <div class="auth-input">
                    <label for="email">
                        E-Mail :
                    </label>
                    <input type="email" name="email" id="name" />
                </div>
                <div class="auth-input">
                    <label for="password">
                        Password :
                    </label>
                    <input type="password" name="password" id="password" />
                </div>
                <button type="submit" name="submit" class="auth-btn">Log In</button>
                <br>
                <div class="auth-bottom">
                    Don't have an account yet? <a href="">Create Now</a>
                </div>
            </form>
            
        </div>
    </div>
</body>
</html>
