<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom styles for fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');
        
        /* Gilroy font fallback - replace with actual font files if available */
        .font-gilroy-regular {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }
        .font-gilroy-medium {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }
        .font-gilroy-bold {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="m-0 text-base font-normal leading-relaxed text-gray-800 font-sans overflow-x-hidden">
    <div class="auth w-full h-screen flex flex-col items-center justify-center relative select-none">
        <div class="auth-container w-96 mx-5 relative">
            <div class="absolute z-50 w-10 h-10 rounded-full">
              <a href="home"> <img src="icon/close.svg" alt="close"></a> 
            </div>
            <form method="post" class="auth-form w-full bg-[#CCF3EA] shadow-[0_4px_10px_rgba(0,0,0,0.12)] p-6 rounded-xl relative">
                <div class="itemscontainer flex flex-col items-center">
                    <div class="auth-logo w-48 flex items-center justify-center relative mb-5">
                        <svg width="100px" viewBox="0 0 60 62" fill="none" class="signInIcon__TpQ4">
                            <circle cx="30" cy="30" r="30" fill="#EAFBF7"></circle>
                            <circle cx="29.887" cy="29.887" r="22.521" fill="#D3F6EE"></circle>
                            <path d="M24.273 59.597l-5.421-6.17a3.112 3.112 0 01.254-4.362 3.033 3.033 0 014.312.257l3.797 4.323V35.789c0-.79.31-1.547.861-2.105a2.925 2.925 0 012.08-.871c.78 0 1.53.313 2.08.871.553.558.863 1.315.863 2.105V49.18h2.942c2.34 0 4.585.94 6.24 2.615a8.98 8.98 0 012.585 6.313v1.49" stroke="#008768" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
                            <path d="M38.973 42.188a14.88 14.88 0 005.223-7.468c.922-2.981.892-6.18-.086-9.143a14.872 14.872 0 00-5.362-7.366 14.633 14.633 0 00-8.614-2.81c-3.092 0-6.106.984-8.614 2.81a14.872 14.872 0 00-5.362 7.366a15.024 15.024 0 00-.086 9.143a14.88 14.88 0 005.223 7.468" stroke="#008768" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </div>
                    <h1 class="m-0 leading-normal text-3xl font-extrabold font-gilroy-medium mb-5 text-center">
                        Log in and get exploring
                    </h1>
                    <p class="text-center mb-6">
                        Log into your account with your email and password, or create one below. Quick and easy - promise!
                    </p>
                </div>
                
                <div class="auth-input w-full relative mb-4 flex flex-col items-start justify-center">
                    <label for="email" class="font-extrabold font-gilroy-regular text-base mb-1 text-gray-800 leading-normal">
                        E-Mail :
                    </label>
                    <input type="email" name="email" id="email" 
                           class="w-full h-10 rounded-full border-2 border-gray-300 outline-none appearance-none flex items-center justify-center text-left transition-all duration-200 ease-in-out px-3 py-2 hover:border-blue-600 focus:border-blue-600 focus:ring-2 focus:ring-blue-200" />
                </div>
                
                <div class="auth-input w-full relative mb-4 flex flex-col items-start justify-center">
                    <label for="password" class="font-extrabold font-gilroy-regular text-base mb-1 text-gray-800 leading-normal">
                        Password :
                    </label>
                    <input type="password" name="password" id="password" 
                           class="w-full h-10 rounded-full border-2 border-gray-300 outline-none appearance-none flex items-center justify-center text-left transition-all duration-200 ease-in-out px-3 py-2 hover:border-blue-600 focus:border-blue-600 focus:ring-2 focus:ring-blue-200" />
                </div>
                
                <button type="submit" name="submit" 
                        class="auth-btn w-1/2 h-10 bg-blue-600 border-none rounded-full outline-none appearance-none relative text-white font-extrabold font-gilroy-medium text-sm tracking-wider transition-all duration-200 ease-in-out cursor-pointer flex items-center justify-center text-center mx-auto hover:bg-blue-700 focus:bg-blue-700 focus:ring-2 focus:ring-blue-300">
                    Log In
                </button>
                
                <div class="auth-bottom mt-4 flex items-center justify-center no-underline text-gray-800 font-extrabold font-gilroy-medium transition-all duration-200 ease-in-out text-center leading-normal">
                    Don't have an account yet? 
                    <a href="signup.html" class="flex items-center no-underline text-blue-600 font-extrabold font-gilroy-medium ml-1 hover:opacity-80">
                        Create Now
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
